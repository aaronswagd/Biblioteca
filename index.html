<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="biblioteca">
  <header class="cabecera">
    <button id="btn-tema" class="btn-tema" aria-label="Cambiar tema">
      <span id="icono-tema">🌕</span>
    </button>
    <h1>Biblioteca</h1>
    <p class="subtitulo">Historias originales</p>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-fondo" data-cerrar></div>
    <div class="modal-caja" role="dialog" aria-modal="true">
      <button class="modal-cerrar" data-cerrar aria-label="Cerrar">×</button>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <script src="js/tema.js?v=8"></script>
  <script src="js/datos.js?v=10"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
